spring.application.name=community-health-survey

# --- H2 file-based database: no install needed, data persists in ./data/healthsurveydb.* ---
spring.datasource.url=jdbc:h2:file:./data/healthsurveydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Jyotsna2005@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional browser console at /h2-console (JDBC URL above) for inspecting tables
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
