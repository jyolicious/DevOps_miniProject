# Isolated, in-memory database for Jenkins browser tests; this profile uses no MySQL credentials.
spring.datasource.url=jdbc:h2:mem:chss_selenium;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
server.port=${APP_PORT:8181}
