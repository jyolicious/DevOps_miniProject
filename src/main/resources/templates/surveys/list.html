<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Survey Records</title>
</head>

<body>

<h1>Community Health Survey Records</h1>

<a href="/surveys/create">
    Create New Survey
</a>

<br><br>

<form method="get"
      action="/surveys">

    <input type="text"
           name="query"
           th:value="${query}"
           placeholder="Search by ID, name, location or condition">

    <button type="submit">
        Search
    </button>

    <a href="/surveys">
        Clear
    </a>

</form>

<br>

<p th:if="${#lists.isEmpty(surveys)}">
    No records found.
</p>

<table border="1"
       cellpadding="8"
       th:if="${not #lists.isEmpty(surveys)}">

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Location</th>
        <th>Health Condition</th>
        <th>Survey Date</th>
        <th>Status</th>
        <th>Action</th>
        <th>Creator</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="survey : ${surveys}">

        <td th:text="${survey.id}"></td>

        <td th:text="${survey.name}"></td>

        <td th:text="${survey.age}"></td>

        <td th:text="${survey.gender}"></td>

        <td th:text="${survey.location}"></td>

        <td th:text="${survey.healthCondition}"></td>

        <td th:text="${survey.surveyDate}"></td>

        <td th:text="${survey.status}"></td>

        <td th:text="${survey.creator}"></td>

        <td>

            <a th:href="@{/surveys/{id}(id=${survey.id})}">
                View
            </a>

            |

            <a th:href="@{/surveys/{id}/edit(id=${survey.id})}">
                Edit
            </a>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a href="/">Back to Home</a>

</body>

</html>
