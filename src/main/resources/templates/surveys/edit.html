<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Edit Survey</title>
</head>

<body>

<h1>Edit Survey</h1>

<p>
    Survey ID:
    <strong th:text="${survey.id}"></strong>
</p>

<p>
    Current Status:
    <strong th:text="${survey.status}"></strong>
</p>

<form th:action="@{/surveys/{id}/update(id=${survey.id})}"
      th:object="${survey}"
      method="post">

    <label>Name:</label>
    <input type="text"
           th:field="*{name}">

    <p th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}">
    </p>

    <br><br>

    <label>Age:</label>
    <input type="number"
           th:field="*{age}">

    <p th:if="${#fields.hasErrors('age')}"
       th:errors="*{age}">
    </p>

    <br><br>

    <label>Gender:</label>

    <select th:field="*{gender}">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <br><br>

    <label>Location:</label>
    <input type="text"
           th:field="*{location}">

    <p th:if="${#fields.hasErrors('location')}"
       th:errors="*{location}">
    </p>

    <br><br>

    <label>Health Condition:</label>
    <input type="text"
           th:field="*{healthCondition}">

    <p th:if="${#fields.hasErrors('healthCondition')}"
       th:errors="*{healthCondition}">
    </p>

    <br><br>

    <label>Survey Date:</label>
    <input type="date"
           th:field="*{surveyDate}">

    <p th:if="${#fields.hasErrors('surveyDate')}"
       th:errors="*{surveyDate}">
    </p>

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a th:href="@{/surveys/{id}(id=${survey.id})}">
    Cancel
</a>

</body>

</html>
